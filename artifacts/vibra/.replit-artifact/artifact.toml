kind = "web"
previewPath = "/"
title = "VIBRA"
version = "1.0.0"
id = "artifacts/vibra"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20178

[services.development]
run = "pnpm --filter @workspace/vibra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vibra", "run", "build" ]
publicDir = "artifacts/vibra/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20178"
BASE_PATH = "/"
